<!DOCTYPE html>
<html lang="es">
<!--
  ==============================================================
  Calculadora Salarial de Función Pública (Tablas Oficiales 2026)
  Desarrollado por: Rubén
  Uso: Repositorio público / GitHub
  ==============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Salarial Funcionarios (2026)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-slate-900">Calculadora Salarial</h1>
          <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Ejercicio 2026</span>
        </div>
        <p class="text-sm text-slate-500 mt-1">Función Pública: cálculo mensual ordinario, pagas extra y reducciones</p>
      </div>
      <button id="btnSaveFav" class="px-3 py-2 bg-amber-50 text-amber-700 border border-amber-300 rounded-lg text-sm font-medium hover:bg-amber-100 transition shadow-sm cursor-pointer">
        ⭐ Guardar como favorito
      </button>
    </header>

    <!-- Barra de Favoritos -->
    <section id="favsContainer" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Puestos favoritos guardados</h2>
      <div id="favsList" class="flex flex-wrap gap-2"></div>
    </section>

    <!-- Formulario Principal -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Bloque 1: Retribuciones Básicas, Trienios y Jornada -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-lg font-semibold border-b pb-2 text-slate-800">1. Retribuciones Básicas & Trienios</h2>
        
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Subgrupo del Puesto</label>
          <select id="subgrupo" class="w-full border-slate-300 rounded-lg p-2 border bg-slate-50 font-medium">
            <option value="A1">A1</option>
            <option value="A2" selected>A2</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-2">Trienios reconocidos por Subgrupo</label>
          <div class="grid grid-cols-4 gap-2">
            <div>
              <span class="block text-[11px] text-center font-bold text-slate-500">A1</span>
              <input type="number" id="trieniosA1" min="0" value="0" class="w-full text-center border rounded p-1.5 border-slate-300">
            </div>
            <div>
              <span class="block text-[11px] text-center font-bold text-slate-500">A2</span>
              <input type="number" id="trieniosA2" min="0" value="0" class="w-full text-center border rounded p-1.5 border-slate-300">
            </div>
            <div>
              <span class="block text-[11px] text-center font-bold text-slate-500">C1</span>
              <input type="number" id="trieniosC1" min="0" value="0" class="w-full text-center border rounded p-1.5 border-slate-300">
            </div>
            <div>
              <span class="block text-[11px] text-center font-bold text-slate-500">C2</span>
              <input type="number" id="trieniosC2" min="0" value="0" class="w-full text-center border rounded p-1.5 border-slate-300">
            </div>
          </div>
        </div>

        <!-- Jornada y Reducción -->
        <div class="pt-3 border-t space-y-3">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-medium text-slate-600">Jornada semanal de referencia</label>
            <div class="inline-flex rounded-lg border border-slate-200 p-0.5 bg-slate-50 text-xs">
              <label class="cursor-pointer">
                <input type="radio" name="tipoJornada" value="35" checked class="sr-only peer">
                <span class="px-2.5 py-1 rounded-md block font-medium peer-checked:bg-blue-600 peer-checked:text-white text-slate-600 transition">35 h (AGE / UC3M)</span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="tipoJornada" value="37.5" class="sr-only peer">
                <span class="px-2.5 py-1 rounded-md block font-medium peer-checked:bg-blue-600 peer-checked:text-white text-slate-600 transition">37,5 h (CAM)</span>
              </label>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-medium text-slate-600">Porcentaje de Jornada</label>
              <span id="pctJornadaVal" class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded">100%</span>
